<form class="ai-manual-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <header>
    <h2>Paste A Specification</h2>
    <span>Paste an existing specification and add any instructions the generated Plan should follow.</span>
  </header>

  <step-form-field [showRequiredMarker]="true">
    <step-label>Specification</step-label>
    <textarea
      formControlName="specification"
      placeholder="Paste a test specification, acceptance criteria, or requirements..."
    ></textarea>
    @if (specificationControl.touched && specificationControl.errors) {
      <step-error>
        <step-errors-list [errors]="specificationControl.errors" [keysDictionary]="requiredErrorDictionary" />
      </step-error>
    }
    <step-hint>
      <span class="ai-manual-form__counter">{{ specificationLength() }} characters</span>
    </step-hint>
  </step-form-field>

  <step-form-field>
    <step-label>Shared Instructions</step-label>
    <textarea formControlName="sharedInstructions"></textarea>
  </step-form-field>

  <footer class="ai-manual-form__actions ai-manual-form__actions--end">
    <button type="submit" mat-flat-button color="primary">
      <step-icon name="sparkles" />
      <span>Generate Plan</span>
    </button>
  </footer>
</form>
