<main class="ai-start-page">
  <section class="ai-start-page__content" aria-label="Create With AI">
    <step-ai-prompt
      appearance="start-page"
      heading="Create With AI"
      supportingText="Describe the automation you want. Step will generate a Plan and the required Keywords."
      placeholder="Describe what you want to automate or test..."
      actionLabel="Generate Plan"
      (generationRequested)="generatePlan($event)"
    />

    <section class="ai-start-page__examples" aria-labelledby="ai-examples-title">
      <h2 id="ai-examples-title">Try an example</h2>
      <div class="ai-start-page__examples-grid">
        @for (example of promptExamples; track example.id) {
          <button type="button" mat-stroked-button (click)="applyExample(example)">
            <step-icon [name]="example.icon" aria-hidden="true" />
            <span class="ai-start-page__example-label">{{ example.label }}</span>
            <step-icon name="arrow-right" aria-hidden="true" />
          </button>
        }
      </div>
    </section>

    <section class="ai-start-page__help" aria-labelledby="ai-help-title">
      <h2 id="ai-help-title">Documentation & Tutorials</h2>
      <div class="ai-start-page__help-grid">
        @for (card of helpCards; track card.id) {
          <article class="ai-start-page__help-card">
            <header>
              <span class="ai-start-page__help-icon" aria-hidden="true">
                <step-icon [name]="card.icon" />
              </span>
              <h3>{{ card.title }}</h3>
            </header>
            <p>{{ card.description }}</p>
            <a
              [href]="card.url"
              [attr.target]="card.isExternal ? '_blank' : null"
              [attr.rel]="card.isExternal ? 'noopener noreferrer' : null"
            >
              <span>{{ card.linkLabel }}</span>
              <step-icon name="arrow-right" aria-hidden="true" />
            </a>
          </article>
        }
      </div>
    </section>
  </section>

  <footer class="ai-start-page__footer">
    <step-icon name="help-circle" aria-hidden="true" />
    <span>
      Need help? Check the
      <a [href]="documentationUrl" target="_blank" rel="noopener noreferrer">Documentation</a>
      or
      <a [href]="communityUrl" target="_blank" rel="noopener noreferrer">Community</a>.
    </span>
  </footer>
</main>
