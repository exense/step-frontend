<main class="ai-generate-page">
  <header class="ai-generate-page__header">
    <span>
      <h1>Generate Test Cases With AI</h1>
      <span>Describe the behavior to automate and any instructions the AI agent should follow.</span>
    </span>
    <aside class="ai-generate-page__availability" aria-live="polite">
      @if (availabilityMessage(); as message) {
        <step-alert type="warning">
          <step-icon name="alert-triangle" aria-hidden="true" />
          <span>{{ message }}</span>
        </step-alert>
      }
    </aside>
  </header>

  <section class="ai-generate-page__tabs" aria-label="Generation Input Type">
    <step-tabs tabMode="tabs" [tabs]="tabs" [activeTabId]="activeTabId()" (activeTabIdChange)="selectTab($event)">
      <span *stepTabTemplate="let tab" class="ai-generate-page__tab-label">
        <step-icon [name]="tab.icon" aria-hidden="true" />
        <span>{{ tab.label }}</span>
      </span>
    </step-tabs>
  </section>

  <section class="ai-generate-page__card">
    <div class="ai-generate-page__mode" [hidden]="activeTabId() !== generateWithAiTabId">
      <step-ai-prompt
        heading="Describe What You Want To Automate"
        supportingText="Include the behavior, data, and any relevant instructions for the AI agent."
        placeholder="For example: Validate user login with valid and invalid credentials, log out, and verify the session ends."
        actionLabel="Generate Test Cases"
        (generationRequested)="handleGenerationRequested($event)"
      />
    </div>

    <div class="ai-generate-page__mode" [hidden]="activeTabId() !== defineTestCasesTabId">
      <step-ai-define-test-cases (generationRequested)="handleGenerationRequested($event)" />
    </div>

    <div class="ai-generate-page__mode" [hidden]="activeTabId() !== pasteSpecificationTabId">
      <step-ai-paste-specification (generationRequested)="handleGenerationRequested($event)" />
    </div>
  </section>
</main>
