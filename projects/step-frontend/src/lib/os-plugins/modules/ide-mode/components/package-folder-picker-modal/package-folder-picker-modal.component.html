<step-modal-window [title]="_data.title">
  <div step-modal-window-body>
    @if (_data.withName) {
      <div [formGroup]="packageForm">
        <step-form-field [showRequiredMarker]="true">
          <step-label>Package name</step-label>
          <input type="text" formControlName="name" />
        </step-form-field>
      </div>
    }

    <div class="location-bar">
      <button
        stepTestId="folder-picker-up-btn"
        type="button"
        mat-icon-button
        matTooltip="Go to parent folder"
        [disabled]="!parentPath()"
        (click)="loadParentDirectory()"
      >
        <step-icon name="corner-left-up" />
      </button>
      <step-form-field>
        <input
          stepTestId="folder-picker-location-input"
          type="text"
          aria-label="Location"
          placeholder="Paste a folder path"
          [formControl]="locationControl"
          (keydown.enter)="loadLocation()"
        />
      </step-form-field>
      <button
        stepTestId="folder-picker-go-btn"
        type="button"
        mat-icon-button
        matTooltip="Go to location"
        [disabled]="!locationControl.value.trim()"
        (click)="loadLocation()"
      >
        <step-icon name="arrow-right" />
      </button>
    </div>

    <div class="folder-list">
      @for (item of items(); track item.absolutePath) {
        @if (item.isDirectory && !item.isHidden) {
          <button
            mat-button
            [class.selected]="selectedFolder() === item.absolutePath"
            (click)="onSelectFolder(item.absolutePath)"
            (dblclick)="onLoadSubfolder(item.absolutePath)"
          >
            <step-icon name="check" />
            {{ item.name }}
          </button>
        }
      }
    </div>
  </div>
  <div step-modal-window-buttons>
    <button type="button" mat-stroked-button (click)="_dialogRef.close(undefined)">Cancel</button>
    <button type="button" mat-stroked-button (click)="onCreateFolder()">Create Folder</button>
    <button
      type="button"
      mat-flat-button
      color="primary"
      (click)="apply()"
      [disabled]="!selectedFolder() && !currentPath()"
    >
      Select
    </button>
  </div>
</step-modal-window>
