<div class="tree-container">
  @if (showSkeleton()) {
    <div class="tree-skeletons" aria-hidden="true">
      @for (row of [1, 2, 3, 4, 5, 6, 7, 8]; track row) {
        <div class="tree-skeleton-row" [class.child-row]="row > 1">
          <span></span>
        </div>
      }
    </div>
  } @else {
    <step-tree
      (treeContextAction)="handleContextAction($event.actionId, $event.node)"
      (nodeClick)="handleNodeClick($event.node)"
      [dragDisabled]="true"
      [forceFocus]="true"
    >
      <ng-template stepTreeNodeNameTemplate let-node>
        <span class="node-name">
          <step-icon [name]="node.icon" [class]="node.iconClassName" />
          <span>{{ node.name }}</span>
          @if (omittedChildrenByNode()[node.id]) {
            <span
              class="children-limit"
              matTooltip="Right-click this node and choose Previous Nodes or Next Nodes to see more children."
              >Some children are not shown</span
            >
          }
        </span>
      </ng-template>
    </step-tree>
  }
</div>
