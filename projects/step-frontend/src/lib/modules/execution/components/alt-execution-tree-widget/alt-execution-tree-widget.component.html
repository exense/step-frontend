<step-alt-report-widget [applyOverflow]="true">
  <step-alt-report-widget-title>
    <step-grid-element-title />
    <step-icon
      name="help-circle"
      matTooltip="Execution results grouped by plan node, with counts and status distribution"
      matTooltipPosition="below"
    />
    <button
      type="button"
      mat-icon-button
      aria-label="Open Execution Trace Tree"
      matTooltip="Open Execution Trace Tree"
      matTooltipPosition="below"
      (click)="openAlternateTree()"
    >
      <step-icon name="open-in-tree" />
    </button>
  </step-alt-report-widget-title>
  <step-alt-report-widget-filter>
    <step-alt-execution-tree-control-panel widgetType="executionTree">
      <step-btn-group class="with-borders maximize-button">
        <button
          type="button"
          mat-stroked-button
          matTooltip="Maximize"
          matTooltipPosition="below"
          (click)="openMaximized()"
        >
          <step-icon name="maximize-2" />
        </button>
      </step-btn-group>
    </step-alt-execution-tree-control-panel>
  </step-alt-report-widget-filter>
  <step-alt-report-widget-content>
    <step-alt-execution-tree
      #tree
      [details]="details()"
      stepAltExecutionTreeSearchFocus
      stepTreeAutoChooseVirtualScroll="100%"
      [applyVirtualScrollFrom]="100"
      [showSpinnerWhileTreeInitialize]="true"
      [showSkeletonWhileLoading]="_state.aggregatedTreeInProgress()"
      (openIterations)="handleOpenIterations($event)"
    />
  </step-alt-report-widget-content>
</step-alt-report-widget>
