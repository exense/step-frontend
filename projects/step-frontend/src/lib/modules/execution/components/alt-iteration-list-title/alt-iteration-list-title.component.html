@let item = displayNode();
<div class="icon-container">
  <step-icon [name]="item?.icon" [class]="item?.iconClassName" />
</div>
<step-aggregated-status
  [hasDescendantInvocations]="item?.hasDescendantInvocations"
  [countByStatus]="item?.countByStatus"
  [interactive]="true"
  action="filter"
  [selectedStatuses]="selectedStatuses()"
  (statusClick)="handleStatusClick($event)"
/>
<span class="name">{{ item?.name }}</span>
