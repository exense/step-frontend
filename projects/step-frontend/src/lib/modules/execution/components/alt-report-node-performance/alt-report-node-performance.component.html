@if (context(); as context) {
  <section class="execution-report-node-details">
    <div class="data-container">
      <div class="container-title">
        <span>Measurements</span>
        @for (status of selectedStatuses(); track status) {
          <button
            [class]="'status-filter-pill status-filter-pill-' + status"
            type="button"
            [attr.aria-label]="'Remove ' + status + ' status filter'"
            (click)="removeStatus.emit(status)"
          >
            <span>{{ status }}</span>
            <step-icon name="x" />
          </button>
        }
        <step-icon
          name="info"
          class="help-icon"
          tabindex="0"
          aria-label="Measurement scope"
          matTooltip="The charts show measurements for this node within the selected execution time range. Status filters match the Iterations list; other list filters do not apply."
        />
      </div>
      <div class="charts">
        <step-standalone-dashlet
          [metricKey]="metricKey"
          [timeRange]="context.timeRange"
          [filters]="context.filters"
          [grouping]="grouping"
          [config]="responseTimesConfig"
        />
        <step-standalone-dashlet
          [metricKey]="metricKey"
          [timeRange]="context.timeRange"
          [filters]="context.filters"
          [grouping]="grouping"
          [config]="throughputConfig"
        />
      </div>
    </div>
  </section>
}
