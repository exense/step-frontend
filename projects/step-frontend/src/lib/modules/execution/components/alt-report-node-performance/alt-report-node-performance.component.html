@if (context(); as context) {
  <section class="execution-report-node-details">
    <div class="data-container">
      <div class="container-title">
        <span>Measurements</span>
        <step-icon
          name="info"
          class="help-icon"
          tabindex="0"
          aria-label="Measurement scope"
          matTooltip="The charts show measurements for this node within the selected execution time range. Use the status dropdown or title counts to filter charts and iterations. Title counts can be combined; clicking the last active count shows all statuses. Tree and list counts open a single-status view. The search field filters only iterations."
        />
      </div>
      <div class="charts">
        <step-standalone-dashlet
          [metricKey]="metricKey"
          [timeRange]="context.timeRange"
          [filters]="context.filters"
          [grouping]="grouping"
          [config]="filteredResponseTimesConfig()"
        />
        <step-standalone-dashlet
          [metricKey]="metricKey"
          [timeRange]="context.timeRange"
          [filters]="context.filters"
          [grouping]="grouping"
          [config]="filteredThroughputConfig()"
        />
      </div>
    </div>
  </section>
}
