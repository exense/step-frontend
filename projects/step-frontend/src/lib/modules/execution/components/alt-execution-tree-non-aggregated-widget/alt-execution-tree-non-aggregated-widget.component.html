<step-alt-report-widget [applyOverflow]="true">
  <step-alt-report-widget-title>
    <step-grid-element-title />
    <step-icon
      name="help-circle"
      matTooltip="Individual execution instances, including loop iterations and runtime-generated nodes."
      matTooltipPosition="below"
    />
    <button
      type="button"
      mat-icon-button
      aria-label="Open Aggregated Execution Tree"
      matTooltip="Open Aggregated Execution Tree"
      matTooltipPosition="below"
      (click)="openAlternateTree()"
    >
      <step-icon name="repeat" />
    </button>
  </step-alt-report-widget-title>
  <step-alt-report-widget-filter>
    <step-alt-execution-tree-control-panel expandTooltip="Expand All Loaded Nodes">
      <step-btn-group class="with-borders maximize-button">
        <button
          type="button"
          mat-stroked-button
          matTooltip="Maximize"
          matTooltipPosition="below"
          (click)="openMaximized()"
        >
          <step-icon name="maximize-2" />
        </button>
      </step-btn-group>
    </step-alt-execution-tree-control-panel>
  </step-alt-report-widget-filter>
  <step-alt-report-widget-content>
    <step-alt-execution-tree-non-aggregated
      stepTreeAutoChooseVirtualScroll="100%"
      [applyVirtualScrollFrom]="100"
      [showSpinnerWhileTreeInitialize]="true"
      [showSkeletonWhileLoading]="_state.reportTreeInProgress()"
      (nodeClick)="openDrillDown($event)"
    />
  </step-alt-report-widget-content>
</step-alt-report-widget>
