@if (singleStatus(); as singleStatus) {
  <step-status
    [status]="singleStatus.status"
    [iconMode]="true"
    [tooltip]="singleStatus.tooltipMessage"
    [class.is-interactive]="interactive() && singleStatus.status !== Status.RUNNING"
    [class.is-inert]="singleStatus.status === Status.RUNNING"
    [class.is-dimmed]="selectedStatuses()?.length && !selectedStatuses()?.includes(singleStatus.status)"
    (stepStrategyClick)="handleClick(singleStatus, $event)"
  />
} @else if (isEmptyStatus()) {
  <div class="status-group">
    <step-icon name="out-of-scope" [matTooltip]="emptyStatusMessage()" matTooltipPosition="below" />
  </div>
} @else {
  @for (item of allStatusItems(); track item.status) {
    @if (item.status === Status.RUNNING && item.count === 1) {
      <step-status
        [status]="item.status"
        [iconMode]="true"
        [tooltip]="item.tooltipMessage"
        class="is-inert"
        [class.is-dimmed]="selectedStatuses()?.length && !selectedStatuses()?.includes(item.status)"
        (stepStrategyClick)="handleClick(item, $event)"
      />
    } @else {
      <div class="status-group">
        <div
          class="step-aggregated-status"
          [class]="item.className"
          [class.is-interactive]="interactive() && item.status !== Status.RUNNING"
          [class.is-inert]="item.status === Status.RUNNING"
          [class.is-dimmed]="selectedStatuses()?.length && !selectedStatuses()?.includes(item.status)"
          [matTooltip]="item.tooltipMessage"
          matTooltipPosition="below"
          (click)="handleClick(item, $event)"
        >
          {{ item.count | shortenNumber: 'x' }}
        </div>
      </div>
    }
  }
}
