<form #form="ngForm">
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        <span>Keyword routing</span>
        @if (context.artefact?.token | panelTokenSelectorsConfigured) {
          <span class="configured-badge">Configured</span>
        }
      </mat-panel-title>
    </mat-expansion-panel-header>
    <section class="panel-content">
      <step-dynamic-json
        label="Agent token selectors"
        optionalFieldsLabel="Agent token selectors"
        addFieldBtnLabel="Add selection criteria"
        [(ngModel)]="context.artefact!.token"
        [disabled]="context.readonly"
        name="token"
      >
      </step-dynamic-json>
    </section>
  </mat-expansion-panel>
</form>
