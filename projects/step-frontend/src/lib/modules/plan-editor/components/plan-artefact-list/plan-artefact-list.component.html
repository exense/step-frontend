<step-table
  class="paddingless-cells compact-rows"
  [defaultPageSize]="50"
  [compactPaginator]="{ singular: 'control', plural: 'controls' }"
  [dataSource]="(availableArtefacts$ | async)!"
  matSort
  matSortActive="label"
  matSortDirection="asc"
  [indicatorMode]="TableIndicatorMode.SKELETON_ON_INITIAL_LOAD"
  [matSortDisableClear]="true"
>
  <ng-container *stepRowsExtension="let rows">
    <step-drag-drop-container stepDropAreaId="planTree" [animatedPreview]="true">
      @for (row of rows; track row.elRef.nativeElement) {
        <step-drag-item
          [elRef]="row.elRef"
          [data]="row.data | artefactDropInfo"
          [dragDisabled]="!('plan-write' | hasRight | async)"
        />
      }
      <step-drag-preview>
        <step-plan-nodes-drag-preview />
      </step-drag-preview>
    </step-drag-drop-container>
  </ng-container>
  <ng-container matColumnDef="move">
    <th mat-header-cell *matHeaderCellDef></th>
    <td class="move" mat-cell *matCellDef="let element">
      <span class="control-grip" matTooltip="Drag into the tree"></span>
    </td>
  </ng-container>
  <ng-container matColumnDef="icon">
    <th mat-header-cell *matHeaderCellDef></th>
    <td class="icon-cell" mat-cell *matCellDef="let element">
      <step-icon [name]="element.icon"></step-icon>
    </td>
  </ng-container>
  <ng-container matColumnDef="label" stepSearchCol>
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let element">
      <div class="artefact-name">
        <span>{{ element.label }}</span>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <div class="actions">
        @if (element.description) {
          <step-icon class="control-help" tabindex="0" [matTooltip]="element.description" name="help-circle" />
        }

        <button
          mat-icon-button
          [matTooltip]="'Add ' + element.label + (insertTargetName() ? ' to ' + insertTargetName() : '')"
          [attr.aria-label]="'Add ' + element.label"
          (click)="addControl(element.label)"
          [disabled]="!('plan-write' | hasRight | async)"
        >
          <step-icon name="plus-circle"></step-icon>
        </button>
      </div>
    </td>
  </ng-container>
</step-table>
