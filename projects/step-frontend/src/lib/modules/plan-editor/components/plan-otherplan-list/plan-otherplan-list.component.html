<step-drag-drop-container>
  <step-table
    #selectionList
    class="paddingless-cells compact-rows"
    [defaultPageSize]="50"
    [compactPaginator]="{ singular: 'plan', plural: 'plans' }"
    stepCustomCellSuffix="attributes.name"
    [dataSource]="dataSource"
    matSort
    matSortActive="name"
    matSortDirection="asc"
    [tableParams]="activatableEntitiesTableParams()"
    [matSortDisableClear]="true"
  >
    <step-plan-sidebar-bulk-add
      *stepAdditionalHeader="'btngroup-bulk-import-create'"
      item="plan"
      (add)="addAllPlans()"
    />
    <ng-container *stepRowsExtension="let rows">
      <step-drag-drop-container stepDropAreaId="planTree" [animatedPreview]="true">
        @for (row of rows; track row.elRef.nativeElement) {
          <step-drag-item
            [elRef]="row.elRef"
            [data]="row.data | planDropInfo"
            [dragDisabled]="!('plan-write' | hasRight | async)"
          />
        }
        <step-drag-preview>
          <step-plan-nodes-drag-preview />
        </step-drag-preview>
      </step-drag-drop-container>
    </ng-container>
    <ng-container matColumnDef="bulkSelection">
      <th mat-header-cell *matHeaderCellDef class="bulk-selection-cell"></th>
      <td mat-cell *matCellDef="let element" class="bulk-selection-cell">
        <step-entity-selection [entity]="element" />
      </td>
    </ng-container>
    <ng-template #cellSuffix let-element>
      @if (element.customFields?.activated === false) {
        <step-icon
          class="version-warning"
          name="alert-circle"
          matTooltip="The version of this plan doesn’t match the selected target execution parameters. Adjust them in the toolbar if needed."
        />
      }
      @if (currentPlanId() && element.id === currentPlanId()) {
        <span class="current-plan-label">Current plan</span>
      }
    </ng-template>
    <step-entity-column-container entityName="plans" />
    <ng-container
      data-step-testid="plans-type-col"
      matColumnDef="type"
      stepActivityCol="Type"
      stepSearchCol
      [isHiddenByDefault]="true"
    >
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        <step-drag-column-caption>Type</step-drag-column-caption>
      </th>
      <td mat-cell *matCellDef="let element">{{ element.root._class }}</td>
    </ng-container>
    <ng-container
      data-step-testid="plans-package-col"
      matColumnDef="automationPackage"
      stepActivityCol="Automation Package"
      stepSearchCol
      [isHiddenByDefault]="true"
    >
      <step-automation-package-filter *stepSearchCellDef stepFilterConnect />
      <th class="automation-package-cell" mat-header-cell *matHeaderCellDef>
        <step-drag-column-caption>&nbsp;</step-drag-column-caption>
      </th>
      <td mat-cell *matCellDef="let element">
        <step-automation-package-ref-icon [entity]="element"></step-automation-package-ref-icon>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions" stepActionCol>
      <th mat-header-cell *matHeaderCellDef>
        <step-column-settings />
      </th>
      <td mat-cell *matCellDef="let element">
        <div class="actions">
          <step-description-hint [description]="element.root.description" />

          <button
            mat-icon-button
            [matTooltip]="'Add ' + element.attributes?.name + (insertTargetName() ? ' to ' + insertTargetName() : '')"
            [attr.aria-label]="'Add ' + element.attributes?.name"
            (click)="addPlan(element.id)"
            [disabled]="!('plan-write' | hasRight | async)"
          >
            <step-icon name="plus-circle"></step-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </step-table>
</step-drag-drop-container>
