<form [formGroup]="form" (ngSubmit)="handleSubmit($event)">
  <step-modal-window title="New Dashboard">
    <div step-modal-window-body>
      <step-form-field [showRequiredMarker]="true">
        <step-label>Name</step-label>
        <input type="text" formControlName="name" />
      </step-form-field>
      <step-form-field>
        <step-label>Description</step-label>
        <textarea [rows]="4" formControlName="description"> </textarea>
      </step-form-field>
    </div>
    <div step-modal-window-buttons>
      <button type="button" mat-stroked-button mat-dialog-close>Cancel</button>
      <button type="submit" mat-flat-button color="primary" value="save">Save</button>
      <button type="submit" mat-flat-button color="primary" value="save-and-edit">Save and edit</button>
    </div>
  </step-modal-window>
</form>
