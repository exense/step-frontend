<step-table class="compact-rows" [dataSource]="dataSource()">
  <ng-container matColumnDef="key" stepSearchCol>
    <th mat-header-cell *matHeaderCellDef>Label</th>
    <td mat-cell *matCellDef="let element" class="item-cell">{{ element.key }}</td>
  </ng-container>
  <ng-container matColumnDef="value" stepSearchCol>
    <th mat-header-cell *matHeaderCellDef>Value</th>
    <td mat-cell *matCellDef="let element" class="item-cell">
      <div>
        <step-auto-shrink-item-value [item]="element" [emptyValue]="emptyValue()" />
        @if (itemAction()?.templateRef; as templateRef) {
          <ng-container *ngTemplateOutlet="templateRef; context: { $implicit: element }" />
        }
      </div>
    </td>
  </ng-container>
</step-table>
