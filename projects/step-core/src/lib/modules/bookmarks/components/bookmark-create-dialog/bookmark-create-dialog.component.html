<form #formContainer="ngForm" (ngSubmit)="save()" style="display: contents">
  <step-modal-window [title]="_data ? 'Rename Bookmark' : 'New Bookmark'">
    <div step-modal-window-body>
      <step-form-field [showRequiredMarker]="true">
        <step-label>Label</step-label>
        <input type="text" placeholder="label" required [(ngModel)]="bookmark!.label" name="label" />
      </step-form-field>
    </div>
    <div step-modal-window-buttons>
      <button type="button" mat-stroked-button mat-dialog-close>Cancel</button>
      <button type="submit" mat-flat-button color="primary">Save</button>
    </div>
  </step-modal-window>
</form>
