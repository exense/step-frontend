@if (activationFailed()) {
  <step-alert type="danger" role="alert">
    Unable to load fields. Please retry.
    <button type="button" mat-button (click)="retryActivation()">Retry</button>
  </step-alert>
}
@if (stEditableLabelMode()) {
  @for (input of inputs(); track input.id) {
    <step-dynamic-label-custom-form-inputs
      [stInput]="input"
      [disabled]="stDisabled()"
      [required]="required()"
      [ngModel]="stModel() | stepCustomFormInputModel: input"
      (ngModelChange)="onInputValueChange(input, $event)"
      (touch)="onCustomInputTouched()"
    />
  }
} @else {
  @for (input of inputs(); track input.id) {
    <step-standard-custom-form-inputs
      [disabled]="stDisabled()"
      [required]="required()"
      [ngModel]="stModel() | stepCustomFormInputModel: input"
      [stInput]="input"
      (ngModelChange)="onInputValueChange(input, $event)"
      (touch)="onCustomInputTouched()"
    />
  }
}
