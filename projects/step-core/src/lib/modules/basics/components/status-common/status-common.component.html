@if (iconMode()) {
  <step-icon
    [ngClass]="className()"
    [name]="status() | statusIcon"
    [matTooltip]="tooltip() ?? status() ?? ''"
    matTooltipPosition="below"
  />
} @else {
  <div class="status" [ngClass]="className()" [matTooltip]="tooltip() ?? ''" matTooltipPosition="below">
    {{ status() }}
  </div>
}
