<step-modal-window [title]="_dialogData.title" [hideButtonsSection]="true">
  @if (_dialogData.subtitle) {
    <div step-modal-window-subtitle>{{ _dialogData.subtitle }}</div>
  }
  <div step-modal-window-body>
    <form (submit)="onSubmit()">
      <step-form-field>
        @if (_dialogData.multiline) {
          <textarea rows="5" name="value" [(ngModel)]="value"></textarea>
        } @else {
          <input type="text" name="value" [(ngModel)]="value" />
        }
      </step-form-field>

      <div class="dialog-actions">
        <button type="button" mat-stroked-button [matDialogClose]="undefined">Cancel</button>
        <button type="submit" mat-flat-button color="primary">
          {{ _dialogData.confirmButtonLabel ?? 'Save' }}
        </button>
      </div>
    </form>
  </div>
</step-modal-window>
